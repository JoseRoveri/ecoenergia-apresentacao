<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoEnergia | Crie seu Companheiro</title>

    <link rel="stylesheet" href="tela6.css">

    <script src="tela6.js" defer></script>
    <script src="navegacao.js" defer></script>
</head>

<body>

    <main class="t6-apresentacao">

        <section class="t6-cena" id="tela-6">

            <!-- =========================
                 CENARIO
            ========================== -->

            <div class="t6-fundo" aria-hidden="true">
            </div>

            <div class="t6-iluminacao" aria-hidden="true">
            </div>


            <!-- =========================
                 TITULO
            ========================== -->

            <header class="t6-cabecalho">

                <div class="t6-placa-titulo">

                    <h1>
                        Crie seu
                        <span>Companheiro!</span>
                    </h1>

                    <p>
                        Cada criança cria um amigo único
                        para viver sua aventura.
                    </p>

                </div>

            </header>


            <!-- =========================
                 LUMI
            ========================== -->

            <div class="t6-area-lumi">

                <div class="t6-balao">

                    <p>
                        Use sua imaginação e escolha
                        os detalhes para criar um amigo
                        <strong>único e especial!</strong>
                    </p>

                </div>

                <img src="assets/personagens/lumi-tela-6.png" alt="Lumi apresentando a criação do companheiro"
                    class="t6-lumi" draggable="false">

            </div>


            <!-- =========================
                 COMPANHEIRO CENTRAL
            ========================== -->

            <div class="t6-area-companheiro">

                <img src="assets/personagens/companheiro-tela-6.png"
                    alt="Companheiro elétrico amarelo personalizado com boné, óculos, lenço e mochila"
                    class="t6-companheiro" draggable="false">

            </div>


            <!-- =========================
                 PAINEL DE PERSONALIZACAO
            ========================== -->

            <div class="t6-area-personalizacao">

                <img src="assets/tela6/painel-personalizacao.png"
                    alt="Opções de personalização: cabeça, rosto, corpo, costas e efeitos especiais"
                    class="t6-painel-personalizacao" draggable="false">

            </div>


            <!-- =========================
                 MENSAGEM INFERIOR
            ========================== -->

            <div class="t6-mensagem">

                <span aria-hidden="true">🌱</span>

                <p>
                    Cada criança cria um companheiro único
                    para viver sua própria aventura!
                </p>

            </div>


            <!-- =========================
                 NAVEGACAO
            ========================== -->

            <nav class="t6-navegacao" aria-label="Navegação da apresentação">

                <a href="tela5.html" class="t6-botao t6-voltar">
                    <span aria-hidden="true">←</span>
                    Voltar
                </a>


                <span class="t6-indicador">
                    06 / 10
                </span>


                <button type="button" class="t6-botao t6-continuar" id="t6-continuar">
                    Continuar
                    <span aria-hidden="true">➜</span>
                </button>

            </nav>

        </section>

    </main>

</body>

</html>
